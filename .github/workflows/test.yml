name: tests

on:
  workflow_dispatch:
    inputs:
      peer_ref:
        description: "Full Contact Center commit SHA for coordinated release validation"
        required: false
        type: string
  pull_request:
    branches:
      - "16.0*"
  push:
    branches:
      - "16.0"
      - "16.0-ocabot-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
      PEER_REF: ${{ inputs.peer_ref || 'fc6a76f207a11f1080ae845982b3c13c9c444ca6' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-ocb16.0:latest
            name: test with OCB
            makepot: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate coordinated dependency revision
        shell: bash
        run: |
          if ! [[ "$PEER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "peer_ref must be a full 40-character commit SHA."
            exit 1
          fi
      - name: Checkout private Contact Center dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: soloztech/contact-center
          # PRs use the validated compatible baseline; a manual release run
          # selects the exact coordinated peer commit without rewriting the workflow.
          ref: ${{ env.PEER_REF }}
          fetch-depth: 0
          path: .ci-private-dependency/contact-center
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
      - name: Verify Contact Center side panel compatibility
        shell: bash
        run: |
          set -euo pipefail
          peer_root="${GITHUB_WORKSPACE}/.ci-private-dependency/contact-center"
          test "$(git -C "$peer_root" rev-parse HEAD)" = "$PEER_REF"
          git -C "$peer_root" merge-base --is-ancestor \
            9d7049915dd9941ece1e5167c6ca7153e2d5e5e3 "$PEER_REF"
      - name: Install private Contact Center addon dependencies
        shell: bash
        run: |
          set -euo pipefail
          sibling_parent="$(mktemp -d "${RUNNER_TEMP}/marketing-center-ci.XXXXXX")"
          sibling_root="${sibling_parent}/contact-center"
          mv "${GITHUB_WORKSPACE}/.ci-private-dependency/contact-center" "${sibling_root}"
          python -m pip install --editable "${sibling_root}/setup/contact_center_base"
          python -m pip install --editable "${sibling_root}/setup/contact_center_ui"
          python -m pip install --editable "${sibling_root}/setup/contact_center_crm"
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Verify the pinned Odoo TLS runtime
        run: python -c "from OpenSSL import crypto; from urllib3.contrib.pyopenssl import PyOpenSSLContext; import cryptography, google.auth"
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests including post-install QUnit suites
        shell: bash
        run: |
          set -euo pipefail
          oca_run_tests 2>&1 | tee "${RUNNER_TEMP}/marketing-center-tests.log"
          python - <<'PYTHON'
          import os
          from pathlib import Path

          log = (Path(os.environ["RUNNER_TEMP"]) / "marketing-center-tests.log").read_text()
          for addon in (
              "marketing_center_website",
              "marketing_center_catalog",
              "marketing_center_catalog_contact_center",
          ):
              for mode in ("minified", "assets"):
                  marker = f"Marketing QUnit verified: {addon} {mode}"
                  assert marker in log, f"Missing successful browser suite: {marker}"
          PYTHON
      - name: Upload test log and QUnit counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: Test log - ${{ matrix.name }}
          path: ${{ runner.temp }}/marketing-center-tests.log
          if-no-files-found: ignore
      - name: Verify Marketing suite does not install Kanban
        run: |
          python - <<'PYTHON'
          import os
          import psycopg2
          with psycopg2.connect(dbname=os.environ["PGDATABASE"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT (SELECT count(*) FROM ir_module_module WHERE name = 'contact_center_crm' AND state = 'installed') = 1 AND NOT EXISTS (SELECT 1 FROM ir_module_module WHERE name = 'contact_center_kanban' AND state = 'installed') AND NOT EXISTS (SELECT 1 FROM ir_model WHERE model = 'contact.center.case')")
                  assert cursor.fetchone()[0], "CRM must install without Kanban or case models"
          PYTHON
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'soloztech' }}
